AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenDSS Cloud completo y efimero: VPC, ALB, CloudFront HTTPS/WSS,
  ECS/Fargate API + N workers, Cloud Map, EFS, Secrets Manager references,
  CloudWatch Logs y autoescalado de workers.

Parameters:
  ProjectName:
    Type: String
    Default: opendss-thesis
    AllowedPattern: '[a-z0-9-]+'
  ApiImageUri:
    Type: String
  WorkerImageUri:
    Type: String
  JwtSecretArn:
    Type: String
  WorkerSharedTokenSecretArn:
    Type: String
  AuthUsersSecretArn:
    Type: String
  CloudFrontPrefixListId:
    Type: String
  WorkerDesiredCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 32
  WorkerMinCount:
    Type: Number
    Default: 1
    MinValue: 1
  WorkerMaxCount:
    Type: Number
    Default: 6
    MinValue: 1
  WorkerCpuTarget:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 95
  ApiCpu:
    Type: String
    Default: '512'
  ApiMemory:
    Type: String
    Default: '1024'
  WorkerCpu:
    Type: String
    Default: '1024'
  WorkerMemory:
    Type: String
    Default: '2048'
  MaxConcurrentSimulationsPerUser:
    Type: Number
    Default: 2
  MaxConcurrentJobs:
    Type: Number
    Default: 8
  AdmissionControlEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  RateLimitEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  RateLimitRequests:
    Type: Number
    Default: 120
  WorkerMaxRetries:
    Type: Number
    Default: 2
  WorkerRetryBackoffSeconds:
    Type: Number
    Default: 2
  WorkerTestProgressDelayMs:
    Type: Number
    Default: 0
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-a'
        - Key: Project
          Value: !Ref ProjectName

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-b'
        - Key: Project
          Value: !Ref ProjectName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin access to public ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      # Egress is intentionally open. Inbound remains the trust boundary, while
      # Fargate tasks need outbound HTTPS for ECR/Secrets/CloudWatch without NAT.
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API Manager accepts traffic only from the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Simulation workers accept traffic only from API Manager
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8100
          ToPort: 8100
          SourceSecurityGroupId: !Ref ApiSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS shared custom models for API and workers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ApiSecurityGroup
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref WorkerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CustomModelsFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub '${ProjectName}-custom-models'
        - Key: Project
          Value: !Ref ProjectName

  CustomModelsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref CustomModelsFileSystem
      PosixUser:
        Uid: '10001'
        Gid: '10001'
      RootDirectory:
        Path: /custom-models
        CreationInfo:
          OwnerUid: '10001'
          OwnerGid: '10001'
          Permissions: '0770'
      AccessPointTags:
        - Key: Project
          Value: !Ref ProjectName

  EfsMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref CustomModelsFileSystem
      SubnetId: !Ref PublicSubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]

  EfsMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref CustomModelsFileSystem
      SubnetId: !Ref PublicSubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/opendss/${ProjectName}/api-manager'
      RetentionInDays: !Ref LogRetentionDays

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/opendss/${ProjectName}/simulation-worker'
      RetentionInDays: !Ref LogRetentionDays

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WorkerNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: opendss.local
      Vpc: !Ref Vpc
      Description: Private worker discovery namespace for OpenDSS Cloud

  WorkerDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: simulation-worker
      NamespaceId: !Ref WorkerNamespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOpenDSSSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref JwtSecretArn
                  - !Ref WorkerSharedTokenSecretArn
                  - !Ref AuthUsersSecretArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-api-manager'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Volumes:
        - Name: custom-models
          EFSVolumeConfiguration:
            FilesystemId: !Ref CustomModelsFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref CustomModelsAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: api-manager
          Image: !Ref ApiImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: APP_HOST
              Value: 0.0.0.0
            - Name: APP_PORT
              Value: '8000'
            - Name: EXECUTION_BACKEND
              Value: worker_pool
            - Name: WORKER_DISCOVERY_BACKEND
              Value: dns
            - Name: WORKER_DISCOVERY_HOST
              Value: simulation-worker.opendss.local
            - Name: WORKER_DISCOVERY_PORT
              Value: '8100'
            - Name: WORKER_DISCOVERY_SCHEME
              Value: http
            - Name: WORKER_DISCOVERY_REFRESH_SECONDS
              Value: '5'
            - Name: SIMULATION_WORKER_TIMEOUT_SECONDS
              Value: '600'
            - Name: CUSTOM_MODELS_DIR
              Value: /app/data/runtime/custom_models
            - Name: MAX_CONCURRENT_SIMULATIONS_PER_USER
              Value: !Sub '${MaxConcurrentSimulationsPerUser}'
            - Name: MAX_CONCURRENT_JOBS
              Value: !Sub '${MaxConcurrentJobs}'
            - Name: ADMISSION_CONTROL_ENABLED
              Value: !Ref AdmissionControlEnabled
            - Name: RATE_LIMIT_ENABLED
              Value: !Ref RateLimitEnabled
            - Name: RATE_LIMIT_REQUESTS
              Value: !Sub '${RateLimitRequests}'
            - Name: WORKER_MAX_RETRIES
              Value: !Sub '${WorkerMaxRetries}'
            - Name: WORKER_RETRY_BACKOFF_SECONDS
              Value: !Sub '${WorkerRetryBackoffSeconds}'
            - Name: WORKER_RETRY_ENABLED
              Value: 'true'
            - Name: LOG_LEVEL
              Value: INFO
          Secrets:
            - Name: JWT_SECRET
              ValueFrom: !Ref JwtSecretArn
            - Name: AUTH_USERS_JSON
              ValueFrom: !Ref AuthUsersSecretArn
            - Name: WORKER_SHARED_TOKEN
              ValueFrom: !Ref WorkerSharedTokenSecretArn
          MountPoints:
            - SourceVolume: custom-models
              ContainerPath: /app/data/runtime/custom_models
              ReadOnly: false
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-simulation-worker'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Volumes:
        - Name: custom-models
          EFSVolumeConfiguration:
            FilesystemId: !Ref CustomModelsFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref CustomModelsAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: simulation-worker
          Image: !Ref WorkerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8100
              Protocol: tcp
          Environment:
            - Name: WORKER_HOST
              Value: 0.0.0.0
            - Name: WORKER_PORT
              Value: '8100'
            - Name: CUSTOM_MODELS_DIR
              Value: /app/data/runtime/custom_models
            - Name: WORKER_TEST_PROGRESS_DELAY_MS
              Value: !Sub '${WorkerTestProgressDelayMs}'
          Secrets:
            - Name: WORKER_SHARED_TOKEN
              ValueFrom: !Ref WorkerSharedTokenSecretArn
          MountPoints:
            - SourceVolume: custom-models
              ContainerPath: /app/data/runtime/custom_models
              ReadOnly: false
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/internal/health')"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '3600'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-api'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbListener
      - EfsMountTargetA
      - EfsMountTargetB
    Properties:
      ServiceName: !Sub '${ProjectName}-api'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref ApiSecurityGroup]
      LoadBalancers:
        - ContainerName: api-manager
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn:
      - EfsMountTargetA
      - EfsMountTargetB
    Properties:
      ServiceName: !Sub '${ProjectName}-worker'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: !Ref WorkerDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref WorkerSecurityGroup]
      ServiceRegistries:
        # For an A-record Cloud Map service with awsvpc networking, only the
        # registry ARN is required. ContainerName/Port are SRV-oriented fields.
        - RegistryArn: !GetAtt WorkerDiscoveryService.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WorkerScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: WorkerService
    Properties:
      MinCapacity: !Ref WorkerMinCount
      MaxCapacity: !Ref WorkerMaxCount
      ResourceId: !Sub 'service/${ProjectName}-cluster/${ProjectName}-worker'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  WorkerCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-worker-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WorkerScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref WorkerCpuTarget
        ScaleInCooldown: 300
        ScaleOutCooldown: 30
        # Workers hold in-memory OpenDSS session contexts. Scaling in automatically
        # could terminate a task that owns an active session, so cloud auto scaling
        # is deliberately scale-out-only for this thesis architecture.
        DisableScaleIn: true
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} HTTPS/WSS edge entrypoint'
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: alb-origin
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
          Compress: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  CloudFrontDomainName:
    Value: !GetAtt Distribution.DomainName
  ApplicationUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  CloudFrontDistributionId:
    Value: !Ref Distribution
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  EcsClusterName:
    Value: !Sub '${ProjectName}-cluster'
  ApiServiceName:
    Value: !Sub '${ProjectName}-api'
  WorkerServiceName:
    Value: !Sub '${ProjectName}-worker'
  WorkerDiscoveryName:
    Value: simulation-worker.opendss.local
  EfsFileSystemId:
    Value: !Ref CustomModelsFileSystem
  ApiLogGroupName:
    Value: !Ref ApiLogGroup
  WorkerLogGroupName:
    Value: !Ref WorkerLogGroup
