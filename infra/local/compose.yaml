name: opendss-lab

services:

  simulation-worker:
    build:
      context: ../..
      dockerfile: services/simulation_worker/Dockerfile

    restart: unless-stopped

    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: 8100
      RECYCLE_THRESHOLD: ${RECYCLE_THRESHOLD:-162}
      CUSTOM_MODELS_DIR: /app/data/runtime/custom_models

    volumes:
      - custom-models:/app/data/runtime/custom_models

    expose:
      - "8100"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/internal/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  api-manager:
    build:
      context: ../..
      dockerfile: services/api_manager/Dockerfile

    restart: unless-stopped

    depends_on:
      simulation-worker:
        condition: service_healthy

    ports:
      - "${APP_PORT:-8000}:8000"

    env_file:
      - path: ../../.env
        required: false

    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000

      EXECUTION_BACKEND: worker_http
      SIMULATION_WORKER_URL: http://simulation-worker:8100
      SIMULATION_WORKER_TIMEOUT_SECONDS: ${SIMULATION_WORKER_TIMEOUT_SECONDS:-600}

      MAX_ACTIVE_SIMULATIONS: ${MAX_ACTIVE_SIMULATIONS:-32}

      ALLOW_CUSTOM_MODELS: ${ALLOW_CUSTOM_MODELS:-true}
      CUSTOM_MODELS_DIR: /app/data/runtime/custom_models

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

    volumes:
      - custom-models:/app/data/runtime/custom_models

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  custom-models: